name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test

  db-tests:
    runs-on: ubuntu-latest
    name: pgTAP (Supabase)
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned so we don't hit the GitHub releases API on every run
          # (that lookup is rate-limited and was failing intermittently).
          # Must be recent enough to support db.major_version = 17 in
          # supabase/config.toml — the 2.20.x line is too old.
          version: 2.40.7
      # `supabase start` brings up Postgres in Docker (preinstalled on the
      # GitHub-hosted runner) and applies every migration in supabase/migrations.
      - name: Start local Supabase
        run: supabase start
      # `supabase test db` runs every .sql file in supabase/tests against the
      # local instance. Migrations 0015-0017 + the 19 Tier 6 pgTAP files land
      # here for the first time.
      - name: Run pgTAP suite
        run: supabase test db
