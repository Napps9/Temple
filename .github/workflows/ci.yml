name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# The Supabase CLI's telemetry client (PostHog) can time out during
# shutdown on CI runners and turn an otherwise-successful command into
# exit 1 ("Timeout while shutting down PostHog") — it killed a deploy
# right after `supabase link` succeeded. DO_NOT_TRACK is the standard
# console opt-out the CLI honours.
env:
  DO_NOT_TRACK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # HUSKY=0 skips the prepare-script hook install in CI — we don't need
      # commit hooks in a one-shot runner and the prepare step would fail
      # before .husky/ is read.
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: "0"
      - run: npx tsc --noEmit
      - run: npm test

  db-tests:
    runs-on: ubuntu-latest
    name: pgTAP (Supabase)
    steps:
      - uses: actions/checkout@v4
      - name: Read Supabase CLI version
        id: cli
        # Single source of truth for the CLI version — local `npm run dev`
        # warns on mismatch, CI pins to this same value. Bumping
        # package.json#supabase.cli_version flows everywhere.
        run: echo "version=$(jq -r '.supabase.cli_version' package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}
      - name: Start local Supabase
        run: supabase start
      - name: Run pgTAP suite
        run: supabase test db

  db-deploy:
    # Only on push to main (PRs from forks don't get secrets exposed
    # anyway). Needs both gates green so a bad migration can't slip past
    # the pgTAP suite straight into prod.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, db-tests]
    runs-on: ubuntu-latest
    name: Deploy migrations to hosted
    # Serialise deploys: two quick merges queue instead of interleaving
    # `db push` against the same hosted project.
    concurrency:
      group: db-deploy
      cancel-in-progress: false
    # Job-level so both `link` and `push` see credentials — link also
    # connects to the database and needs the password non-interactively.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      # Full history: the changed-function diff below needs the previous
      # head, and the default depth-1 checkout does not have it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read Supabase CLI version
        id: cli
        run: echo "version=$(jq -r '.supabase.cli_version' package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}
      - name: Link to hosted project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      # --include-all matches the workflow we already run locally — lets us
      # push migrations whose numbers fall before the latest applied one
      # (we shipped 0029 after 0030 earlier in the project's history).
      - name: Push migrations
        run: supabase db push --include-all
      # Which functions this push actually changed.
      #
      # Deploying all thirty-nine on every push was correct and slow: each
      # one bundles its own deps from esm.sh, and a bad spell there once
      # cost twenty-eight minutes on a push that touched no function at
      # all. The set is still derived from the tree rather than a
      # hand-maintained list — a new function silently missing from a list
      # is how sync-vapi-assistant / voice-sample / agent-interview once
      # shipped undeployed.
      #
      # Two things widen a change to everything, because narrowing them
      # would skip a function that genuinely needs redeploying:
      #
      #   * _shared/ — fourteen functions import it, and it is bundled into
      #     each of them at deploy time, so editing it changes their
      #     shipped code without touching their directories.
      #   * config.toml — it carries every function's verify_jwt, which is
      #     read at deploy time.
      #
      # And anything we cannot diff confidently is also everything: a first
      # push, or a force push whose old head the runner no longer has.
      # Re-running a failed deploy job recomputes against the same
      # `before`, so a function that failed is retried rather than skipped.
      - name: Work out which edge functions changed
        id: fns
        run: |
          all_functions() {
            for dir in supabase/functions/*/; do
              name="$(basename "$dir")"
              [ "$name" = "_shared" ] && continue
              echo "$name"
            done
          }
          before='${{ github.event.before }}'
          why=""
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            why="no previous head to compare against"
          elif ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            why="previous head $before is not in this checkout"
          else
            changed="$(git diff --name-only "$before" "$GITHUB_SHA" \
              -- supabase/functions supabase/config.toml)"
            if printf '%s\n' "$changed" \
                 | grep -qE '^supabase/(functions/_shared/|config\.toml$)'; then
              why="shared code or function config changed"
            fi
          fi
          if [ -n "$why" ]; then
            names="$(all_functions)"
            echo "::notice::deploying every edge function — $why"
          else
            # A deleted function still shows in the diff; drop anything
            # whose directory has gone rather than asking Supabase to
            # deploy it.
            names="$(printf '%s\n' "$changed" \
              | sed -n 's|^supabase/functions/\([^/]*\)/.*|\1|p' \
              | sort -u \
              | while read -r n; do
                  [ -n "$n" ] && [ -d "supabase/functions/$n" ] && echo "$n"
                done)"
          fi
          echo "names=$(printf '%s' "$names" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          if [ -z "$names" ]; then
            echo "No edge function changed."
          else
            echo "Deploying:$(printf '%s' "$names" | tr '\n' ' ')"
          fi
      # Edge functions aren't covered by `db push`. Deploy them after the
      # migration so the Communications Suite workers ship in lock-step with
      # the schema they call (track -> comms_track_event, send-campaign ->
      # the email_* tables / effective_can). Deployed by name and after the
      # link above; each one's verify_jwt comes from supabase/config.toml.
      - name: Deploy edge functions
        # Bundling fetches deps from esm.sh, which intermittently returns a
        # Cloudflare 522 and fails an otherwise-fine deploy. Retry each
        # function a few times with backoff so a transient CDN blip doesn't
        # red the run. Crucially, a function that still fails after retries
        # does NOT abort the run — otherwise one flaky early function (e.g.
        # a 522 on `track`) blocks every function after it from deploying.
        # We attempt them all, tally failures, and fail the step at the end.
        run: |
          names="${{ steps.fns.outputs.names }}"
          if [ -z "$names" ]; then
            echo "Nothing to deploy."
            exit 0
          fi
          failed=""
          deploy() {
            for attempt in 1 2 3; do
              if supabase functions deploy "$1"; then
                return 0
              fi
              echo "::warning::deploy $1 failed (attempt $attempt) — retrying"
              sleep $((attempt * 10))
            done
            echo "::error::deploy $1 failed after 3 attempts"
            failed="$failed $1"
            return 0
          }
          for name in $names; do
            deploy "$name"
          done
          if [ -n "$failed" ]; then
            echo "::error::edge functions failed to deploy:$failed"
            exit 1
          fi
