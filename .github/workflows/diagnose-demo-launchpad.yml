name: Diagnose demo-launchpad

# Verifying the /site/<slug> routing fix. Delete once confirmed.

on:
  workflow_dispatch: {}

env:
  DO_NOT_TRACK: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the public site (demo-launchpad and demo-ironworks)
        run: |
          for slug in demo-launchpad demo-ironworks; do
            echo "--- $slug ---"
            curl -sD - -o /tmp/body.html "https://app.jointemple.io/site/$slug" | grep -Ei "^(HTTP|x-vercel-cache)"
            echo "body (first 300 chars):"
            head -c 300 /tmp/body.html
            echo ""
          done
