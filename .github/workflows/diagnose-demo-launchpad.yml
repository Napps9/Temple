name: Diagnose demo-launchpad

# One-off diagnostic: the marketing site's iframe of
# app.jointemple.io/site/demo-launchpad intermittently shows "not
# published" even in a fresh incognito session, while a direct visit
# sometimes works. This checks the raw HTTP response/headers (to rule
# out CDN caching) and the actual database row (to rule out a data
# problem), bypassing any browser/client variable entirely. Delete
# this workflow once the cause is found.

on:
  workflow_dispatch: {}

env:
  DO_NOT_TRACK: "1"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          HUSKY: "0"

      - name: Curl the public site three times, show headers
        run: |
          for i in 1 2 3; do
            echo "--- attempt $i ---"
            curl -sD - -o /tmp/body_$i.html "https://app.jointemple.io/site/demo-launchpad" | grep -Ei "^(HTTP|cache-control|age|x-vercel-cache|cdn-cache-control|x-matched-path)"
            echo "body (first 200 chars):"
            head -c 200 /tmp/body_$i.html
            echo ""
            sleep 2
          done

      - name: Curl a pre-existing tenant (demo-ironworks) for comparison
        run: |
          echo "--- demo-ironworks (existed long before demo-launchpad) ---"
          curl -sD - -o /tmp/body_ironworks.html "https://app.jointemple.io/site/demo-ironworks" | grep -Ei "^(HTTP|cache-control|age|x-vercel-cache|x-matched-path)"
          echo "body (first 300 chars):"
          head -c 300 /tmp/body_ironworks.html
          echo ""
          echo "--- demo-launchpad root without trailing path, and with explicit empty page ---"
          curl -sD - -o /tmp/body_root.html "https://app.jointemple.io/site/demo-launchpad/" | grep -Ei "^(HTTP|x-vercel-cache|x-matched-path)"
          head -c 200 /tmp/body_root.html
          echo ""

      - name: Curl the credentials endpoint
        run: |
          curl -sD - "https://app.jointemple.io/api/demo-credentials" -H "Origin: https://jointemple.io" | head -c 2000

      - name: Query the database directly (bypasses app/CDN entirely)
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
          (async () => {
            const { data: gym, error: gymErr } = await sb.from('gyms').select('id, slug, name, public_signup_enabled').eq('slug', 'demo-launchpad').maybeSingle();
            console.log('gym row:', JSON.stringify(gym), gymErr?.message ?? '');
            if (gym) {
              const { data: site, error: siteErr } = await sb.from('gym_websites').select('gym_id, published, theme').eq('gym_id', gym.id).maybeSingle();
              console.log('gym_websites row:', JSON.stringify(site), siteErr?.message ?? '');
            }
            const { data: rpc, error: rpcErr } = await sb.rpc('gym_website_by_slug', { p_slug: 'demo-launchpad' });
            console.log('gym_website_by_slug RPC (service role):', JSON.stringify(rpc), rpcErr?.message ?? '');
          })();
          "

      - name: Query the database via anon key (what the app actually uses)
        env:
          SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY secret not set in this repo — skipping anon-key check. If EXPO_PUBLIC_SUPABASE_ANON_KEY on Vercel differs from this project's anon key, that alone would explain it."
            exit 0
          fi
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_ANON_KEY);
          (async () => {
            const { data, error } = await sb.rpc('gym_website_by_slug', { p_slug: 'demo-launchpad' });
            console.log('gym_website_by_slug RPC (anon key, same project as GH secrets):', JSON.stringify(data), error?.message ?? '');
          })();
          "
