<!-- Supabase Auth → Email Templates → "Reauthentication"
     Subject: Your Temple verification code
     This one sends a 6-digit code ({{ .Token }}), not a link. -->
<!doctype html>
<html>
  <body style="margin:0;background:#F4F2ED;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your Temple verification code.</div>
    <div style="max-width:520px;margin:0 auto;padding:32px 20px;">
      <div style="text-align:center;padding:4px 0 28px;">
        <img src="https://app.jointemple.io/email/temple-lockup.png" alt="Temple" width="188" style="display:inline-block;width:188px;max-width:60%;height:auto;border:0;outline:none;text-decoration:none;" />
      </div>
      <div style="background:#ffffff;border-radius:16px;padding:28px;border:1px solid #ECE8DF;">
        <h1 style="margin:0 0 14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;color:#111111;">Your verification code</h1>
        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#334155;">
          <p style="margin:0 0 14px;">Enter this code to confirm it's you:</p>
        </div>
        <div style="text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;font-weight:800;letter-spacing:8px;color:#111111;background:#F4F2ED;border-radius:10px;padding:16px;margin:6px 0;">{{ .Token }}</div>
      </div>
      <p style="text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#94a3b8;margin:18px 0 4px;">If you didn't request this, you can safely ignore this email.</p>
      <p style="text-align:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;color:#B8B3AA;margin:6px 0 0;letter-spacing:1px;">TEMPLE TECHNOLOGY</p>
    </div>
  </body>
</html>
