<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
  </head>
  <body style="margin:0;padding:0;background:#F4F5F6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F5F6;">
      <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;">

          <tr><td align="center" style="padding:6px 0 26px;">
            <img src="https://app.jointemple.io/email/temple-lockup.png" alt="Temple" width="196" style="display:block;width:196px;max-width:60%;height:auto;border:0;outline:none;text-decoration:none;">
          </td></tr>

          <tr><td style="background:#ffffff;border:1px solid #E4E6E9;border-radius:16px;overflow:hidden;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td height="4" style="height:4px;background:#14161A;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="padding:32px;">
                <h1 style="margin:0 0 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:23px;line-height:1.3;font-weight:700;color:#14161A;">Your sign-in link</h1>
                <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#3f4650;">
                  Sign in to Temple with the button below. This link works once and expires shortly.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:26px auto 6px;">
                  <tr><td align="center" bgcolor="#C2410C" style="border-radius:8px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 30px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;line-height:1;color:#ffffff;text-decoration:none;border-radius:8px;">Sign in to Temple</a>
                  </td></tr>
                </table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:26px 0 2px;">
                  <tr><td style="padding:0 0 9px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px;color:#8A8F98;text-transform:uppercase;">&#128203;&nbsp;Copy &amp; paste this link into your browser</td></tr>
                  <tr><td style="background:#EEF0F3;border:1px solid #E1E4E8;border-radius:10px;padding:13px 15px;">
                    <a href="{{ .ConfirmationURL }}" style="font-family:'SFMono-Regular',Consolas,Menlo,monospace;font-size:12px;line-height:1.6;color:#14161A;text-decoration:none;word-break:break-all;">{{ .ConfirmationURL }}</a>
                  </td></tr>
                </table>
              </td></tr>
            </table>
          </td></tr>

          <tr><td align="center" style="padding:24px 12px 2px;">
            <span style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#94a3b8;">If you didn't try to sign in, you can safely ignore this email.</span>
          </td></tr>

        </table>
      </td></tr>
    </table>
  </body>
</html>
