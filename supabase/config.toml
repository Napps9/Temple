project_id = "temple"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["http://127.0.0.1:8081", "temple://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Temple-branded auth email templates (matching the transactional layout
# in supabase/functions/_shared/email-layout.ts). NOTE: the hosted
# project does NOT pick these up from the migration deploy — they apply
# locally via `supabase start`, and on hosted via a one-time
# `supabase config push` (or pasting the HTML into Dashboard -> Auth ->
# Email Templates). See docs/email-branding.md.
[auth.email.template.confirmation]
subject = "Confirm your email — Temple"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Temple password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email — Temple"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Your Temple sign-in link"
content_path = "./supabase/templates/magic_link.html"

# The app never triggers these two today (no inviteUserByEmail call, no
# reauthenticate() flow) — branded anyway so an invite sent from the
# dashboard's Users page, or a future secure-password-change, arrives
# wearing the company chrome instead of Supabase's default.
[auth.email.template.invite]
subject = "You're invited to Temple"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Temple verification code"
content_path = "./supabase/templates/reauthentication.html"

# Communications Suite delivery + tracking workers. send-campaign needs a
# signed-in staff caller (it re-checks can_manage_comms); track is the
# public open-pixel / click-redirect / unsubscribe endpoint, so JWT
# verification is off there.
[functions.send-campaign]
# verify_jwt is false because the function re-authorises every caller itself
# — effective_can(can_manage_comms) for a person clicking Send, the
# x-automation-secret shared secret for the pg_cron dispatcher (0199). The
# gateway's JWT check was redundant with that, and it blocked the dispatcher's
# non-JWT shared-secret credential from ever reaching the function.
verify_jwt = false

[functions.track]
verify_jwt = false

# Delivery reports from Resend (delivered / bounced / complained). No JWT —
# Resend carries none; the Standard Webhooks signature against
# RESEND_WEBHOOK_SECRET is the guard, and the function refuses anything
# unsigned rather than falling back to trusting the payload.
[functions.resend-webhook]
verify_jwt = false

# Per-gym sending domain management (Resend Management API). Signed-in
# staff caller; re-checks can_manage_comms per action.
[functions.sending-domain]
verify_jwt = true

# Emails a gym invite. Signed-in staff caller; mints the code via
# create_invite (which enforces the role gate) and sends via Resend.
[functions.send-invite]
verify_jwt = true

# Reads the gym's connected Stripe account to preview existing
# subscriptions for import. Signed-in owner caller (re-checks
# user_is_owner_of); read-only — no Stripe writes.
[functions.stripe-import]
verify_jwt = true

# Stripe Connect (Standard) OAuth. -start mints the authorize URL for a
# signed-in owner; -callback is hit by Stripe's browser redirect (no JWT)
# and is guarded by the single-use state token instead.
[functions.stripe-connect-start]
verify_jwt = true

[functions.stripe-connect-callback]
verify_jwt = false

# Owner-only Connect account health check + disconnect (asks Stripe whether
# the connected account is actually reachable / charges-enabled).
[functions.stripe-account]
verify_jwt = true

# Member checkout — opens a Stripe Checkout session (direct charge) for a
# plan on the gym's connected account. Signed-in member caller.
[functions.stripe-checkout]
verify_jwt = true

# Store checkout — opens a Stripe Checkout session (direct charge) for a
# basket of store items on the gym's connected account. Signed-in member.
[functions.store-checkout]
verify_jwt = true

# Cancel a recurring store subscription at period end. Signed-in caller;
# re-checks ownership / can_manage_store through RLS.
[functions.store-cancel-subscription]
verify_jwt = true

# Change or cancel a membership: member self-serve where the gym's policy
# allows, or staff approving/rejecting a change request. Signed-in caller.
[functions.stripe-modify-subscription]
verify_jwt = true

# Stripe webhook — Connect events from gyms' accounts. No JWT (Stripe
# carries none); guarded by the signature against STRIPE_WEBHOOK_SECRET.
[functions.stripe-webhook]
verify_jwt = false

# Ops security-alert notifier, called by the security-monitor pg_cron job via
# pg_net (no user JWT); guarded by the x-security-secret shared secret.
[functions.security-alert]
verify_jwt = false

# Email-automation worker. Two paths, both no-JWT: the drain (called by the
# dispatch-email-automations pg_cron job via pg_net, guarded by the
# x-automation-secret shared secret) and the public one-click unsubscribe
# link carried in each automated email.
[functions.send-email-automations]
verify_jwt = false

# Lead-to-coach notification worker. Called best-effort by the public
# /lead/<slug> capture form, which is anonymous — there is no JWT to verify.
# It only drains an already-decided queue (written by security-definer RPCs)
# to the assigned coach's own address and returns counts, so no per-caller
# authorisation applies.
[functions.send-lead-notifications]
verify_jwt = false

# AI front desk. The SMS webhook is hit by Twilio (no JWT); the guard is
# the X-Twilio-Signature HMAC. The voice function is hit by Vapi (guarded
# by the x-vapi-secret header) and by Twilio's voice webhook on the
# /missed-call path (Twilio signature again). Staff take-over requires a
# signed-in caller and re-authorises through RLS on the conversation row.
[functions.lead-agent-sms]
verify_jwt = false

[functions.lead-agent-voice]
verify_jwt = false

[functions.lead-agent-staff-send]
verify_jwt = true

# Drafts the AI sales agent's brief from gym data + owner answers via Claude.
# Signed-in owner/admin caller; re-checks can_review_ai_calls.
[functions.generate-agent-prompt]
verify_jwt = true

# Pushes prompt/tools/voice/greeting to the gym's Vapi assistant.
# Signed-in owner/admin caller (re-checks can_review_ai_calls).
[functions.sync-vapi-assistant]
verify_jwt = true

# Synthesises/caches a voice sample clip. Signed-in caller.
[functions.voice-sample]
verify_jwt = true

# /start is a signed-in owner (checks can_review_ai_calls in code); but
# /end-of-call is Vapi's webhook with no Supabase JWT — so JWT off, the
# code guards each path (effective_can / x-vapi-secret) itself.
[functions.agent-interview]
verify_jwt = false

# Called by pg_net from the retention sweeps with x-purge-secret, no JWT.
[functions.purge-agent-storage]
verify_jwt = false

# Self-serve provisioning of a gym's phone number + Vapi assistant on Temple's
# platform accounts (Twilio + Vapi). Signed-in owner/admin (re-checks
# can_review_ai_calls); gated on the operator-set front_desk_entitled flag.
[functions.provision-front-desk]
verify_jwt = true

# Tears the above down on churn / turn-off. Same owner/admin gate.
[functions.deprovision-front-desk]
verify_jwt = true
